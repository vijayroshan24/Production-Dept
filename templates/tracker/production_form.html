{% extends 'tracker/base.html' %}
{% block content %}<div class="form-panel"><div class="panel-head"><div><h2>{{ form_title }}</h2><p>Record units completed during a production shift.</p></div></div><form method="post" class="modal-form">{% csrf_token %}{% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}<label>Project {{ form.project }}{{ form.project.errors }}</label><div class="form-grid"><label>Completed units {{ form.quantity }}{{ form.quantity.errors }}</label><label>Shift {{ form.shift }}{{ form.shift.errors }}</label></div><label>Note {{ form.note }}{{ form.note.errors }}</label><div class="modal-actions"><a class="button secondary" href="{% url 'production_log' %}">Cancel</a><button class="button primary" type="submit">{{ submit_label }}</button></div></form></div>{% endblock %}
