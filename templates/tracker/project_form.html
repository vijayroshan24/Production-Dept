{% extends 'tracker/base.html' %}
{% block content %}<div class="form-panel"><div class="panel-head"><div><h2>{{ form_title }}</h2><p>Keep project ownership and delivery details up to date.</p></div></div><form method="post" class="modal-form">{% csrf_token %}{% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid"><label>Project name {{ form.name }}{{ form.name.errors }}</label><label>Project code {{ form.code }}{{ form.code.errors }}</label></div><div class="form-grid"><label>Manager {{ form.manager }}{{ form.manager.errors }}</label><label>Assembly line {{ form.assembly_line }}{{ form.assembly_line.errors }}</label></div><div class="form-grid"><label>Target units {{ form.target_units }}{{ form.target_units.errors }}</label><label>Due date {{ form.due_date }}{{ form.due_date.errors }}</label></div><label>Status {{ form.status }}{{ form.status.errors }}</label><div class="modal-actions"><a class="button secondary" href="{% url 'projects' %}">Cancel</a><button class="button primary" type="submit">{{ submit_label }}</button></div></form></div>{% endblock %}
